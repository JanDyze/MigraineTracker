<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mighty icon: Crescent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3170"/>
      <stop offset="1" stop-color="#0E1230"/>
    </linearGradient>
    <mask id="moon">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="752" cy="262" r="70" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- A rounded lowercase m resting under a crescent: rest, dark room, relief -->
  <path d="M300,770 V574 a106,106 0 0 1 212,0 V770 M512,574 a106,106 0 0 1 212,0 V770"
        fill="none" stroke="#FFFFFF" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="714" cy="296" r="84" fill="#FFD98A" mask="url(#moon)"/>
</svg>
