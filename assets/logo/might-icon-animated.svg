<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Might icon (animated)</title>
  <style>
    /* 3.6s loop. The swell traces at constant speed (0–1.1s). As the trace crests each wave
       (0.35s, 0.87s) a ghost copy ripples out from that crest and fades: ba-dum. Then the calm
       line glides out, it all holds, fades, and repeats. Static for reduced-motion users. */
    .swell, .ghost { stroke-dasharray: 1 2; animation: trace 3.6s linear infinite; }
    .ghost { opacity: 0; transform-box: view-box; }
    .ghost-a { transform-origin: 296px 402px; animation: trace 3.6s linear infinite, ripple-a 3.6s infinite; }
    .ghost-b { transform-origin: 528px 472px; animation: trace 3.6s linear infinite, ripple-b 3.6s infinite; }
    .calm { stroke-dasharray: 1 2; animation: calm 3.6s infinite; }
    .mark { animation: fade 3.6s ease-in infinite; }

    @keyframes trace {
      0%        { stroke-dashoffset: 1.05; }
      30.6%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes ripple-a {
      0%, 9.8%  { opacity: 0; transform: scale(1); animation-timing-function: step-end; }
      9.81%     { opacity: 0.75; transform: scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      14.9%     { opacity: 0.5; }
      27.4%, 100% { opacity: 0; transform: scale(1.55); }
    }
    @keyframes ripple-b {
      0%, 24.2% { opacity: 0; transform: scale(1); animation-timing-function: step-end; }
      24.21%    { opacity: 0.75; transform: scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      29.3%     { opacity: 0.5; }
      41.8%, 100% { opacity: 0; transform: scale(1.55); }
    }
    @keyframes calm {
      0%, 30.6% { stroke-dashoffset: 1.2; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      45.8%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes fade {
      0%, 88% { opacity: 1; }
      100%    { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .swell, .calm, .mark { animation: none; stroke-dashoffset: 0; }
      .ghost { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="168" y1="0" x2="856" y2="0">
      <stop offset="0.3" stop-color="#E86F58"/>
      <stop offset="0.85" stop-color="#2E8C84"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#FFFFFF"/>
  <g class="mark" fill="none" stroke="url(#line)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round">
    <path class="ghost ghost-a" pathLength="1" stroke-width="54" d="M168,622 C212,622 236,402 296,402 C356,402 360,622 412,622 C464,622 476,472 528,472 C580,472 596,622 648,622"/>
    <path class="ghost ghost-b" pathLength="1" stroke-width="54" d="M168,622 C212,622 236,402 296,402 C356,402 360,622 412,622 C464,622 476,472 528,472 C580,472 596,622 648,622"/>
    <path class="calm" pathLength="1" d="M648,622 L856,622"/>
    <path class="swell" pathLength="1" d="M168,622 C212,622 236,402 296,402 C356,402 360,622 412,622 C464,622 476,472 528,472 C580,472 596,622 648,622"/>
  </g>
</svg>
